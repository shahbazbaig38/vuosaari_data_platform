[project]
name = "vuosaari-data-platform"
version = "0.1.0"
description = "Incremental daily electricity data ingestion pipeline for Vuosaari"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.1.1",
    "requests>=2.34.2",
]

[project.scripts]
vuosaari-data-platform = "vuosaari_data_platform.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vuosaari_data_platform"]
